name: Opóźnienia pociągów (GTFS-RT, kopia dla aplikacji)

on:
  schedule:
    - cron: '*/10 * * * *'    # co ok. 10 minut (GitHub bywa opóźniony)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live.yml'

permissions:
  contents: write

concurrency:
  group: gtfs-live
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz opóźnienia (PKP PLK przez mkuran.pl)
        run: |
          curl -fL --retry 3 --retry-delay 5 -o updates.json https://mkuran.pl/gtfs/polish_trains/updates.json
          python3 -c "import json;j=json.load(open('updates.json'));assert j.get('trip_updates') is not None;print(len(j['trip_updates']),'kursow')"
      - name: Opublikuj w gałęzi gtfs-live (bez narastania historii)
        run: |
          git init -q -b gtfs-live
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add updates.json
          git commit -qm "updates $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gtfs-live
