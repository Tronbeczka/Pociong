name: Baza przejazdów kolejowych (Polska, OSM)

# Co tydzień liczy z OpenStreetMap wszystkie przejazdy kolejowo-drogowe w Polsce i zapisuje je w katalogu przejazdy/
# (komórki 0,5° × 0,5°). Aplikacja pobiera je z GitHub Pages, gdy serwery Overpass nie odpowiadają.
on:
  schedule:
    - cron: '23 2 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/przejazdy_pl.py'
      - '.github/workflows/przejazdy.yml'

permissions:
  contents: write

concurrency:
  group: przejazdy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteka pyosmium
        run: pip install "osmium>=4.0"
      # Pobieranie z ponawianiem i wznawianiem (plik ma ok. 2 GB): zerwane połączenie nie zaczyna od zera i nie kończy zadania błędem.
      # Gdy Geofabrik nie odpowiada, a baza w repozytorium ma mniej niż 3 tygodnie, zadanie kończy się ostrzeżeniem (za tydzień kolejna próba);
      # błąd – i mail – dopiero, gdy baza naprawdę się starzeje.
      - name: Wyciąg OSM dla Polski (Geofabrik)
        id: dl
        env:
          PBF: https://download.geofabrik.de/europe/poland-latest.osm.pbf
          POLY: https://download.geofabrik.de/europe/poland.poly
        run: |
          get(){   # get <adres> <plik>: do 6 prób, każda wznawia przerwane pobieranie
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --http1.1 --connect-timeout 20 -C - -o "$2" "$1"; then return 0; fi
              echo "$2: próba $i nieudana (curl: $?)"
              if [ "$i" -lt 6 ]; then sleep $((i*${WAIT:-20})); fi
            done
            return 1
          }
          ok=1
          get "$PBF" poland.osm.pbf || ok=0
          if [ "$ok" = 1 ]; then get "$POLY" poland.poly || ok=0; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = 1 ]; then ls -la poland.osm.pbf poland.poly; exit 0; fi
          age=$(python3 -c "import json,datetime;t=json.load(open('przejazdy/meta.json'))['t'];print((datetime.date.today()-datetime.date.fromisoformat(t[:10])).days)" 2>/dev/null || echo -1)
          echo "baza w repozytorium: wiek w dniach: $age"
          if [ "$age" -ge 0 ] && [ "$age" -lt 21 ]; then
            echo "::warning title=Geofabrik nie odpowiada::Nie udało się pobrać wyciągu OSM – zostaje baza przejazdów sprzed $age dni. Za tydzień kolejna próba."
            exit 0
          fi
          echo "::error title=Baza przejazdów się nie odświeża::Nie udało się pobrać wyciągu OSM, a baza ma ponad 3 tygodnie albo nie da się ustalić jej wieku."
          exit 1
      - name: Liczenie przejazdów
        if: steps.dl.outputs.ok == '1'
        run: python tools/przejazdy_pl.py poland.osm.pbf poland.poly przejazdy
      - name: Zapis do repozytorium
        if: steps.dl.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A przejazdy
          if git diff --cached --quiet; then echo "bez zmian"; exit 0; fi
          git commit -q -m "Baza przejazdów: $(python -c "import json;m=json.load(open('przejazdy/meta.json'));print(m['t'],m['n'],'przejazdów')")"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
