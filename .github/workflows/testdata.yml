name: Dane testowe (Wrocław i okolice)

# Wyciąg OpenStreetMap z okolic Wrocławia do testów aplikacji (śledzenie drogi bez trasy, ostrzeżenia na prawdziwych przejazdach).
# Uruchamia się tylko ręcznie albo po zmianie tego pliku – nie ma harmonogramu, nie wysyła maili przy zwykłej pracy.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/testdata.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SRC: https://download.geofabrik.de/europe/poland/dolnoslaskie-latest.osm.pbf
      BBOX: 16.70,50.95,17.35,51.25
    steps:
      - name: Narzędzia
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Pobierz województwo dolnośląskie (Geofabrik)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL --http1.1 --connect-timeout 20 -C - -o dl.osm.pbf "$SRC"; then break; fi
            echo "próba $i nieudana"; sleep $((i*20))
          done
          ls -la dl.osm.pbf
      - name: Wytnij okolice Wrocławia
        run: |
          osmium extract -b "$BBOX" --strategy=smart -o box.osm.pbf dl.osm.pbf
          osmium tags-filter box.osm.pbf nwr/highway nwr/railway w/building nwr/natural=water w/waterway nwr/landuse nwr/leisure=park nwr/place nwr/bridge nwr/tunnel -o wroclaw.osm.pbf
          ls -la box.osm.pbf wroclaw.osm.pbf
          osmium fileinfo -e wroclaw.osm.pbf | head -30
          date -u +%FT%TZ > updated.txt
      - name: Opublikuj w gałęzi testdata
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir out && mv wroclaw.osm.pbf updated.txt out/ && cd out
          git init -q -b testdata
          git config user.name "gtfs-bot"; git config user.email "gtfs-bot@users.noreply.github.com"
          git add . && git commit -qm "Wrocław OSM $(date -u +%F)"
          git push -q -f "$PUSH_URL" testdata
