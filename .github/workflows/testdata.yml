name: Dane testowe (kafelki mapy okolic Wrocławia)

# Uruchamiane ręcznie albo po zmianie tego pliku. Pobiera kafelki wektorowe (OpenFreeMap, z14) dla okolic Wrocławia
# i zapisuje je w gałęzi test-data – służą wyłącznie do testów aplikacji na prawdziwych drogach i przejazdach.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/testdata.yml'

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pobierz kafelki
        run: |
          python3 - <<'PY'
          import json,math,os,urllib.request,time
          tj=json.load(urllib.request.urlopen('https://tiles.openfreemap.org/planet',timeout=30))
          tpl=tj['tiles'][0];z=14;n=2**z
          def xy(lat,lon):return int((lon+180)/360*n),int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*n)
          x0,y1=xy(51.02,16.85);x1,y0=xy(51.20,17.20)
          os.makedirs('wro',exist_ok=True);ok=0
          for x in range(x0,x1+1):
              for y in range(y0,y1+1):
                  u=tpl.replace('{z}',str(z)).replace('{x}',str(x)).replace('{y}',str(y))
                  for i in range(4):
                      try:
                          b=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'pociong-testdata'}),timeout=40).read()
                          open('wro/%d_%d_%d.pbf'%(z,x,y),'wb').write(b);ok+=1;break
                      except Exception as e:
                          print('ponawiam',x,y,repr(e)[:80]);time.sleep(3)
          json.dump({'z':z,'x0':x0,'x1':x1,'y0':y0,'y1':y1,'ok':ok,'tpl':tpl},open('wro/meta.json','w'))
          print('kafelków',ok,'z',(x1-x0+1)*(y1-y0+1))
          PY
          tar czf wro_tiles.tar.gz wro && ls -la wro_tiles.tar.gz
      - name: Zapisz w gałęzi test-data
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir out && mv wro_tiles.tar.gz out/ && cd out
          git init -q -b test-data
          git config user.name "gtfs-bot"; git config user.email "gtfs-bot@users.noreply.github.com"
          git add . && git commit -qm "kafelki testowe $(date -u +%F)"
          git push -q -f "$PUSH_URL" test-data
